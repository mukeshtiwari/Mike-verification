name = "MikeRs"
defaultTargets = ["MikeRs"]

# Aeneas standard library and tactics (progress/step, scalar_tac, ...).
# Local checkout: clone https://github.com/AeneasVerif/aeneas next to this repo.
[[require]]
name = "aeneas"
path = "../aeneas/backends/lean"

# Must stay on the same Mathlib release that Aeneas is built against.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "MikeRs"
